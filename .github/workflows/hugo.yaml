# Workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect UI-affecting changes
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "No push diff available; running visual tests."
            exit 0
          fi
          if ! changed="$(git diff --name-only "$before" HEAD)"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "Diff against $before failed; running visual tests."
            exit 0
          fi
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -E -q '^(themes/|layouts/|static/|tests/|\.github/workflows/|hugo\.toml|mise\.toml|\.tool-versions|playwright\.config\.js|package(-lock)?\.json|Makefile)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "Content-only change; skipping Playwright install and visual tests."
          fi

      - name: Ensure generated outputs are not tracked
        run: |
          tracked="$(git ls-files 'public/**' 'resources/**' 'static/css/**' 'themes/pickles/static/css/**')"
          if [ -n "$tracked" ]; then
            echo "Generated files must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install root Node dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.changes.outputs.ui == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.changes.outputs.ui == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install Node dependencies
        run: |
          cd themes/pickles && pnpm install --frozen-lockfile

      - name: Expose theme JS dependencies to Hugo
        run: |
          mkdir -p "$PWD/node_modules"
          ln -sfn "$PWD/themes/pickles/node_modules/swiper" "$PWD/node_modules/swiper"
          ln -sfn "$PWD/themes/pickles/node_modules/zooming" "$PWD/node_modules/zooming"

      - name: Build CSS
        run: |
          cd themes/pickles && pnpm exec sass assets/scss/style.scss:../../static/css/style.css --load-path=node_modules --no-source-map

      - name: Cache Hugo
        uses: actions/cache@v6
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ hashFiles('hugo.toml', 'themes/pickles/theme.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ASSET_VERSION: ${{ github.sha }}
          TZ: Europe/Zurich
        run: |
          hugo --gc --minify --baseURL ${{ steps.pages.outputs.base_url }}/

      - name: Index with Pagefind
        run: pagefind --site public

      - name: Visual smoke test
        if: steps.changes.outputs.ui == 'true'
        timeout-minutes: 5
        run: npm run test:visual

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
